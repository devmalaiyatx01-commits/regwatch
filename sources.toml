# Each [[source]] is one feed or listing page to watch.
#
# kind   = "feed"  RSS 2.0, RSS 1.0 (RDF) or Atom
#          "html"  listing page parsed with CSS selectors (row, title, link, date, summary)
#          "json"  JSON API: items_key points at the list, templates are filled per record
# cloud  = false for sites that refuse cloud datacenter IPs (bot protection, geo-blocking);
#          the scheduled GitHub Actions run skips them and they run from a local machine
# fetch  = "http"     plain HTTP via requests (default)
#          "browser"  headless Chromium via Playwright, for pages that build their content
#                     with JavaScript or refuse non-browser clients
# lang   = language the source normally publishes in (used when detection is unsure)
#
# Add a source, then run:  python -m regwatch validate <id>

[[source]]
id = "mhra-alerts"
authority = "MHRA (UK)"
url = "https://www.gov.uk/drug-device-alerts.atom"
kind = "feed"
lang = "en"

[[source]]
id = "mhra-dsu"
authority = "MHRA (UK)"
