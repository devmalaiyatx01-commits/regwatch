[[source]]
id = "cdsco-notices"
authority = "CDSCO (India)"
url = "https://cdsco.gov.in/opencms/opencms/en/Notifications/Public-Notices/"
kind = "html"
lang = "en"
row = "table#example tbody tr"
title = ["td:nth-of-type(2)"]
date = "td:nth-of-type(3)"
date_format = "%Y-%b-%d"
link = "td:nth-of-type(4) a"
cloud = false   # connection refused from GitHub's runners (first cloud run, 2026-11-18)

[[source]]
id = "fda-recalls"
authority = "US FDA"
url = "https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts"
kind = "html"
fetch = "browser"
wait_for = "table tbody tr td a"
category_hint = "recall"
lang = "en"
row = "table tbody tr"
title = ["td:nth-of-type(2)", "td:nth-of-type(3)"]
summary = "td:nth-of-type(5)"
date = "td:nth-of-type(1)"
date_format = "%m/%d/%Y"
link = "td:nth-of-type(2) a"
cloud = false   # bot protection never serves the table to a cloud browser; openFDA covers drugs there

# The FDA's official API: drug recall enforcement reports (updated weekly), JSON.
[[source]]
id = "openfda-drug-recalls"
authority = "US FDA"
url = "https://api.fda.gov/drug/enforcement.json?sort=report_date:desc&limit=50"
kind = "json"
lang = "en"
items_key = "results"
title_template = "{classification} drug recall: {product_description}"
summary_template = "Firm: {recalling_firm}. Product: {product_description}. Reason: {reason_for_recall}. Status: {status}."
url_template = "https://api.fda.gov/drug/enforcement.json?search=recall_number:\"{recall_number}\""
date_field = "report_date"
date_format = "%Y%m%d"
category_hint = "recall"
